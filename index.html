<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Te iubesc</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+KR:wght@300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #2a0f24;
    --bg2: #5c1f45;
    --pink: #ffc2d6;
    --rose: #ff7aa2;
    --cream: #fff1e6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(ellipse at 50% 40%, var(--bg2), var(--bg1) 75%);
    overflow: hidden;
  }

  /* 문구들이 같은 자리에 겹쳐 있다가 차례로 나타남 (CSS만 사용) */
  .stage {
    position: relative;
    width: min(90vw, 900px);
    height: 16rem;
  }

  .line {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    opacity: 0;
    animation: cycle 20s infinite;
  }
  .line:nth-child(2) { animation-delay: 4s; }
  .line:nth-child(3) { animation-delay: 8s; }
  .line:nth-child(4) { animation-delay: 12s; }
  .line:nth-child(5) { animation-delay: 16s; }

  .ro {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2.8rem, 9vw, 6rem);
    line-height: 1.2;
    background: linear-gradient(120deg, var(--cream), var(--pink) 50%, var(--rose));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 14px rgba(255, 122, 162, 0.6));
  }

  .ko {
    margin-top: 1rem;
    font-family: 'Noto Serif KR', serif;
    font-weight: 300;
    font-size: clamp(0.9rem, 2.5vw, 1.2rem);
    letter-spacing: 0.3em;
    color: rgba(255, 225, 235, 0.7);
  }

  /* 떠오르는 하트들 */
  .heart {
    position: fixed;
    bottom: -40px;
    color: var(--rose);
    opacity: 0;
    animation: rise linear infinite;
    pointer-events: none;
  }
  .heart:nth-of-type(1) { left: 10%; font-size: 18px; animation-duration: 9s; }
  .heart:nth-of-type(2) { left: 25%; font-size: 28px; animation-duration: 12s; animation-delay: 2s; }
  .heart:nth-of-type(3) { left: 45%; font-size: 14px; animation-duration: 8s;  animation-delay: 4s; }
  .heart:nth-of-type(4) { left: 65%; font-size: 24px; animation-duration: 11s; animation-delay: 1s; }
  .heart:nth-of-type(5) { left: 82%; font-size: 20px; animation-duration: 10s; animation-delay: 3s; }
  .heart:nth-of-type(6) { left: 92%; font-size: 12px; animation-duration: 7s;  animation-delay: 5s; }

  @keyframes cycle {
    0%   { opacity: 0; transform: translateY(15px); filter: blur(6px); }
    5%   { opacity: 1; transform: translateY(0);    filter: blur(0); }
    18%  { opacity: 1; transform: translateY(0);    filter: blur(0); }
    23%  { opacity: 0; transform: translateY(-15px); filter: blur(6px); }
    100% { opacity: 0; }
  }
  @keyframes rise {
    0%   { transform: translateY(0) rotate(0deg);        opacity: 0; }
    10%  { opacity: 0.7; }
    100% { transform: translateY(-110vh) rotate(25deg);  opacity: 0; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="line"><p class="ro">Te iubesc</p></div>
    <div class="line"><p class="ro">Ești lumina vieții mele</p></p></div>
    <div class="line"><p class="ro">Inima mea bate doar pentru tine</p></p></div>
    
    <div class="line"><p class="ro">Ești sufletul meu pereche</p></div>
  </div>

  <span class="heart">♥</span>
  <span class="heart">♥</span>
  <span class="heart">♥</span>
  <span class="heart">♥</span>
  <span class="heart">♥</span>
  <span class="heart">♥</span>
</body>
</html>
